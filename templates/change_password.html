{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Change password — RADIUS Admin{% endblock %}
{% block content %}
  <div class="card-wrap">
    <div class="card">
      <h1>{{ icon('key', 20) }} Change password</h1>
      <p class="lead">for <code>{{ username }}</code></p>
      <form method="post">
        <div class="field">
          <label for="password">{{ icon('lock') }} New password</label>
          <input type="password" id="password" name="password" required autofocus>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">{{ icon('save') }} Update password</button>
          <a href="{{ url_for('users') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
